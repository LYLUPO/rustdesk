name: RustDesk Windows Custom Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.4.1)"
        required: false
        default: "1.4.9"
  push:
    tags:
      - 'v*'

env:
  RENDEZVOUS_SERVER: lupo.work
  RS_PUB_KEY: sR4zYVX0EaghuglbVy2knPPRWW+PoJSnydLAtdbQNVw=
  API_SERVER: http://lupo.work:21114
  FLUTTER_VERSION: 3.24.5
  VCPKG_COMMIT: 2023.10.19

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable Flutter desktop
        run: flutter config --enable-windows-desktop

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          git checkout ${{ env.VCPKG_COMMIT }}
          .\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$PWD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
          & $vcpkg install libvpx opus aom libyuv ffmpeg --triplet x64-windows

      - name: Install LLVM (for ffigen)
        run: choco install llvm --version=16.0.6 -y

      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch hbb_common with company server
        shell: pwsh
        run: |
          $file = "libs/hbb_common/src/config.rs"
          (Get-Content $file) -replace `
            'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', `
            'pub const RENDEZVOUS_SERVERS: &[&str] = &["${{ env.RENDEZVOUS_SERVER }}"];' |
          Set-Content $file
          (Get-Content $file) -replace `
            'pub const RS_PUB_KEY: &str = ".*";', `
            'pub const RS_PUB_KEY: &str = "${{ env.RS_PUB_KEY }}";' |
          Set-Content $file

      - name: Build Flutter Windows
        shell: pwsh
        working-directory: flutter
        run: |
          flutter pub get
          flutter build windows --release

      - name: Prepare files for NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release
          Copy-Item flutter/build/windows/x64/runner/Release/* target/release/ -Recurse

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item flutter/build/windows/x64/runner/Release/* dist/ -Recurse
          Compress-Archive -Path dist/* -DestinationPath rustdesk-portable-windows-x64.zip

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          makensis res/setup.nsi

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ver = (Select-String -Path res/setup.nsi -Pattern '!define VERSION "(.*)"').Matches.Groups[1].Value
          }
          if (-not $ver) { $ver = "1.4.1" }
          echo "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Rename installer
        shell: pwsh
        run: |
          Move-Item rustdesk-setup.exe rustdesk-${{ steps.get_version.outputs.VERSION }}-company-setup.exe

      - name: Generate build info
        shell: pwsh
        run: |
          @"
          RustDesk Custom Build
          ====================
          Version: ${{ steps.get_version.outputs.VERSION }}
          ID Server: ${{ env.RENDEZVOUS_SERVER }}
          Relay Server: ${{ env.RENDEZVOUS_SERVER }}
          API Server: ${{ env.API_SERVER }}
          Build Time: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Commit: ${{ github.sha }}
          "@ | Out-File -Encoding UTF8 BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-custom
          path: |
            *.exe
            *.zip
            BUILD_INFO.txt
          retention-days: 90
