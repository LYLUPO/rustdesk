name: RustDesk Windows Custom Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.4.9)"
        required: false
        default: "1.4.9"
  push:
    tags:
      - 'v*'

env:
  RENDEZVOUS_SERVER: lupo.work
  RS_PUB_KEY: sR4zYVX0EaghuglbVy2knPPRWW+PoJSnydLAtdbQNVw=
  API_SERVER: http://lupo.work:21114
  FLUTTER_VERSION: 3.24.5
  VCPKG_COMMIT: 2023.10.19

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. 拉取代码（含子模块）
      # ============================================================
      - name: Checkout rustdesk
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # ============================================================
      # 2. Flutter 环境
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable Flutter desktop
        run: flutter config --enable-windows-desktop

      # ============================================================
      # 3. Rust 环境
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ============================================================
      # 4. vcpkg（仅 clone + bootstrap，不手动 install）
      #    RustDesk 有 vcpkg.json → 清单模式 → cargo build 时自动安装依赖
      # ============================================================
      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          git checkout ${{ env.VCPKG_COMMIT }}
          .\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$PWD" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ============================================================
      # 5. LLVM（ffigen 需要 libclang）
      # ============================================================
      - name: Install LLVM (for ffigen)
        run: choco install llvm --version=16.0.6 -y --allow-downgrade

      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ============================================================
      # 6. 写死服务器配置到 hbb_common
      # ============================================================
      - name: Patch hbb_common with company server
        shell: pwsh
        run: |
          $file = "libs/hbb_common/src/config.rs"

          $content = Get-Content $file
          $content = $content -replace `
            'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', `
            'pub const RENDEZVOUS_SERVERS: &[&str] = &["${{ env.RENDEZVOUS_SERVER }}"];'
          $content = $content -replace `
            'pub const RS_PUB_KEY: &str = ".*";', `
            'pub const RS_PUB_KEY: &str = "${{ env.RS_PUB_KEY }}";'
          $content | Set-Content $file

          Write-Host "=== Verify patch ==="
          Select-String -Path $file -Pattern "RENDEZVOUS_SERVERS|RS_PUB_KEY"

      # ============================================================
      # 7. 编译 Flutter Windows 客户端
      # ============================================================
      # windows-latest runner 预装 VS 2022，而 RustDesk 写死 VS2019 生成器。
      # Flutter 会在命令行显式传 -G "Visual Studio 16 2019"，优先级高于环境变量，
      # 因此直接用 sed 改 CMakeLists.txt 才能生效。
      - name: Patch CMake generator to VS 2022
        shell: pwsh
        run: |
          $cmake = "flutter/windows/CMakeLists.txt"
          $content = Get-Content $cmake
          $content = $content -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
          $content | Set-Content $cmake
          Write-Host "=== Verify generator ==="
          Select-String -Path $cmake -Pattern "Visual Studio"

      - name: Build Flutter Windows
        shell: pwsh
        working-directory: flutter
        run: |
          flutter pub get
          flutter build windows --release

      # ============================================================
      # 8. 拷贝产物到官方 NSIS 脚本期望的路径
      # ============================================================
      - name: Prepare files for NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item flutter/build/windows/x64/runner/Release/* target/release/ -Recurse -Force
          Write-Host "=== target/release contents ==="
          Get-ChildItem target/release | Select-Object Name, Length

      # ============================================================
      # 9. 打包 Portable ZIP
      # ============================================================
      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item flutter/build/windows/x64/runner/Release/* dist/ -Recurse -Force
          Compress-Archive -Path dist/* -DestinationPath rustdesk-portable-windows-x64.zip -Force
          Write-Host "=== Portable ZIP created ==="
          Get-Item rustdesk-portable-windows-x64.zip | Select-Object Name, Length

      # ============================================================
      # 10. 安装 NSIS
      # ============================================================
      - name: Install NSIS
        run: choco install nsis -y

      # ============================================================
      # 11. 编译 NSIS 安装包
      # ============================================================
      - name: Build NSIS Installer
        shell: pwsh
        run: |
          makensis res/setup.nsi
          Write-Host "=== Installer created ==="
          Get-Item rustdesk-setup.exe | Select-Object Name, Length

      # ============================================================
      # 12. 提取版本号
      # ============================================================
      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $match = Select-String -Path res/setup.nsi -Pattern '!define VERSION "(.*)"'
            if ($match) { $ver = $match.Matches.Groups[1].Value }
          }
          if (-not $ver) { $ver = "1.4.9" }
          echo "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Build version: $ver"

      # ============================================================
      # 13. 重命名安装包
      # ============================================================
      - name: Rename installer
        shell: pwsh
        run: |
          $installer = "rustdesk-${{ steps.get_version.outputs.VERSION }}-company-setup.exe"
          Move-Item rustdesk-setup.exe $installer -Force
          Write-Host "Renamed to: $installer"

      # ============================================================
      # 14. 生成构建信息文件
      # ============================================================
      - name: Generate build info
        shell: pwsh
        run: |
          $info = @"
          ========================================
          RustDesk Custom Build
          ========================================
          Version:        ${{ steps.get_version.outputs.VERSION }}
          ID Server:      ${{ env.RENDEZVOUS_SERVER }}
          Relay Server:   ${{ env.RENDEZVOUS_SERVER }}
          API Server:     ${{ env.API_SERVER }}
          Build Time:     $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Commit:         ${{ github.sha }}
          Branch:         ${{ github.ref_name }}
          ========================================
          "@
          $info | Out-File -Encoding UTF8 BUILD_INFO.txt
          Write-Host $info

      # ============================================================
      # 15. 上传所有产物
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rustdesk-windows-custom
          path: |
            *.exe
            *.zip
            BUILD_INFO.txt
          retention-days: 90
